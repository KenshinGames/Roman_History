<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一日一ローマ</title>
<meta name="description" content="古代ローマ史を、1日3問のクイズと、版図が動く地図つきの年表で覚える。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--APP-->
<svg class="map-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs id="map-defs"></defs></svg>

<div class="app">
  <header class="top">
    <div class="top__brand">
      <p class="top__latin" id="auc-today">AB VRBE CONDITA</p>
      <h1 class="top__name">一日一ローマ</h1>
    </div>
    <p class="top__streak" id="streak" hidden></p>
  </header>

  <div class="tabs" role="tablist" aria-label="画面の切り替え">
    <button class="tabs__btn" id="tab-today" role="tab" aria-controls="view-today" aria-selected="true" type="button">今日の三問</button>
    <button class="tabs__btn" id="tab-nenpyo" role="tab" aria-controls="view-nenpyo" aria-selected="false" type="button">地図と年表</button>
  </div>

  <main>
    <section class="view" id="view-today" role="tabpanel" aria-labelledby="tab-today"></section>
    <section class="view" id="view-nenpyo" role="tabpanel" aria-labelledby="tab-nenpyo" hidden></section>
  </main>

  <p class="foot">試作版です。年代と説明は資料との照合が済んでいません。地図の版図は概略で、細かい境界は正確ではありません。</p>
</div>
<!--/APP-->
<script src="data.js"></script>
<script src="map-data.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
